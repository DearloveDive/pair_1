<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>페어틀 시트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* Layout: input sidebar (left / bottom drawer on phone) + model-sheet preview; sheet = two picture columns flanking a pair-image + height spine */
:root{
  --bg:#E8EAEE; --fg:#1B1E24; --muted:#5E6470; --chrome:#F6F7F9; --chrome-line:#D3D7DE; --field:#FFFFFF;
  --btn:#1B1E24; --btn-fg:#F6F7F9; --focus:#3B82F6;
  --f-display:"Hahmlet","Nanum Myeongjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1114; --fg:#E7E9ED; --muted:#99A0AC; --chrome:#181B20; --chrome-line:#2C3038; --field:#111317;
  --btn:#E7E9ED; --btn-fg:#121418; --focus:#60A5FA; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1114; --fg:#E7E9ED; --muted:#99A0AC; --chrome:#181B20; --chrome-line:#2C3038; --field:#111317;
  --btn:#E7E9ED; --btn-fg:#121418; --focus:#60A5FA; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;padding:0 16px 48px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin:0 -16px 18px;padding:10px 16px;
  background:var(--chrome);border-bottom:1px solid var(--chrome-line);display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;margin-right:auto}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-size:13px;font-weight:600;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--chrome-line);background:transparent}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.btn.warn{border-color:#C2410C;color:#C2410C}
.btn.sm{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.6;cursor:progress}

.app{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start;max-width:1780px;margin:0 auto}

/* ───── sidebar ───── */
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);display:flex;flex-direction:column;
  background:var(--chrome);border:1px solid var(--chrome-line);border-radius:12px;overflow:hidden}
.side-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--chrome-line)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;flex:1;background:var(--bg);padding:3px;border-radius:9px}
.tabs button{border:0;background:transparent;border-radius:7px;padding:7px 4px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
.tabs button .d{width:9px;height:9px;border-radius:50%;flex:none}
.tabs button[aria-selected="true"]{background:var(--chrome);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tabs button span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-close{display:none}
.side-b{overflow:auto;padding:4px 14px 18px;min-height:0}
.grp{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin:16px 0 6px;display:flex;align-items:center;gap:8px}
.grp::after{content:"";flex:1;height:1px;background:var(--chrome-line)}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:9px}
.fld label,.lbl{font-size:12px;font-weight:600;color:var(--muted)}
.inp{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--chrome-line);border-radius:8px;background:var(--field);color:var(--fg)}
.inp:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px rgba(59,130,246,.18)}
.inp.flash{animation:flash 1.1s}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px rgba(59,130,246,.45)}100%{box-shadow:none}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.crow{display:grid;grid-template-columns:auto 38px minmax(0,1fr) auto;align-items:center;gap:7px;margin-bottom:7px}
.crow .lbl{width:38px}
input[type=color]{width:38px;height:34px;padding:2px;border:1px solid var(--chrome-line);border-radius:8px;background:var(--field);cursor:pointer}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;width:24px;height:24px;border-radius:6px}
.x:hover{background:var(--bg)}
.prow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.prow input[type=color]{width:100%}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--bg);padding:3px;border-radius:9px}
.seg label{position:relative;text-align:center;font-size:12px;font-weight:600;padding:6px 2px;border-radius:7px;cursor:pointer;color:var(--muted)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--chrome);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg label:has(input:focus-visible){outline:2px solid var(--focus)}
.imgf{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center;margin-bottom:10px}
.thumb{width:52px;height:52px;border-radius:8px;border:1px dashed var(--chrome-line);background:var(--bg) center/cover no-repeat;display:grid;place-items:center;color:var(--muted);font-size:18px;cursor:pointer}
.thumb.has{border-style:solid}
.imgf .r{display:flex;flex-direction:column;gap:5px;min-width:0}
.imgf .r .top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.imgf .r .top .lbl{margin-right:auto}
.help{font-size:12px;color:var(--muted);margin:10px 0 0}

.fab{display:none}

/* ───── sheet ───── */
.stage{min-width:0}
.sheet{
  --paper:#FBFBFA; --ink:#1B1E24; --muted:#69707C; --line:#D9DCE2; --soft:#EEF0F2; --grid:rgba(27,30,36,.045); --faint:#AEB3BC;
  position:relative;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:28px;font-family:var(--f-body);max-width:1400px;margin:0 auto}
.sheet.dark{--paper:#17191E; --ink:#ECEDEF; --muted:#959BA7; --line:#30343C; --soft:#22252C; --grid:rgba(255,255,255,.035); --faint:#565C67}
.reg{position:absolute;width:14px;height:14px;border:0 solid var(--faint)}
.reg.tl{top:10px;left:10px;border-top-width:1px;border-left-width:1px}
.reg.tr{top:10px;right:10px;border-top-width:1px;border-right-width:1px}
.reg.bl{bottom:10px;left:10px;border-bottom-width:1px;border-left-width:1px}
.reg.br{bottom:10px;right:10px;border-bottom-width:1px;border-right-width:1px}

[data-v]{cursor:pointer;border-radius:2px;white-space:pre-wrap;word-break:break-word}
[data-v]:hover{background:rgba(59,130,246,.09)}
[data-v]:empty::before{content:attr(data-ph);color:var(--faint);font-weight:400}

.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px;padding-bottom:14px;margin-bottom:22px;border-bottom:2px solid var(--ink)}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.pairname{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1.1;letter-spacing:-.02em;margin:4px 0 0}
.pairsub{font-size:13.5px;color:var(--muted);margin-top:4px}
.duo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:18px}
.duo .x2{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.duo .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:1px}

.body{display:grid;grid-template-columns:minmax(0,1fr) 300px minmax(0,1fr);gap:36px;align-items:start}

.char{min-width:0;display:flex;flex-direction:column;gap:14px}
.cn{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.char.b .cn{flex-direction:row-reverse;text-align:right}
.cname{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1.1;letter-spacing:-.02em;margin:2px 0 0;word-break:keep-all}
.cen{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.06em}
.tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;color:var(--acc)}
.letter{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:.8;color:var(--acc)}

.slot{position:relative;display:block;width:100%;max-width:100%;border:1px solid var(--line);background-color:var(--soft);
  background-repeat:no-repeat;background-position:center;background-size:cover;cursor:pointer;overflow:hidden}
.slot .ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:11.5px;line-height:1.4;padding:6px}
.slot .ph b{display:block;font-size:22px;color:var(--acc);font-family:var(--f-display);line-height:1.1}
.hero{aspect-ratio:5/6;box-shadow:7px 7px 0 var(--acc)}
.char.b .hero{box-shadow:-7px 7px 0 var(--acc)}
.facts{position:absolute;left:0;right:0;top:0;display:flex;flex-wrap:wrap;gap:5px;padding:10px}
.char.b .facts{justify-content:flex-end}
.fact{display:inline-flex;align-items:baseline;gap:5px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums}
.fact small{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;color:var(--muted);font-weight:500}
.fact.empty{display:none}

.details{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.details figure{margin:0;display:flex;flex-direction:column;gap:5px;min-width:0}
.details .slot{aspect-ratio:1}
.details figcaption{display:flex;flex-direction:column;gap:1px;font-size:12px;font-weight:600;line-height:1.35;min-width:0}
.details figcaption small{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;color:var(--acc);font-weight:500}

.sec-t{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.sec-t::after{content:"";flex:1;height:1px;background:var(--line)}
.colors{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.col{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.sw{display:inline-block;width:44px;height:44px;border-radius:50%;border:1px solid rgba(0,0,0,.14);cursor:pointer;flex:none}
.sheet.dark .sw{border-color:rgba(255,255,255,.2)}
.sw.unset{background:transparent!important;border:1.5px dashed var(--faint)}
.col .lb{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;color:var(--muted)}
.col .d{font-size:11.5px;font-weight:600;line-height:1.3;width:100%}
.stripe{display:flex;height:30px;border:1px solid var(--line);cursor:pointer}
.stripe span{flex:1}
.stripe span.unset{background-image:linear-gradient(135deg,transparent 46%,var(--line) 46%,var(--line) 54%,transparent 54%)}
.hexes{display:flex;margin-top:3px}
.hexes span{flex:1;text-align:center;font-family:var(--f-mono);font-size:9.5px;color:var(--muted)}
.tags{color:var(--acc);font-weight:600;font-size:13px}
.char.b .tags{text-align:right}
.quote{margin:0;padding:9px 13px;background:var(--soft);border-left:3px solid var(--acc);font-family:var(--f-display);font-size:14.5px}
.char.b .quote{border-left:0;border-right:3px solid var(--acc);text-align:right}

.center{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:16px;align-self:center;text-align:center}
.herowrap{position:relative;margin-bottom:var(--tokpad,0px)}
.herowrap:has(.sdtok:not(.empty)){--tokpad:44px}
.sdtok{position:absolute;bottom:-44px;width:56%;aspect-ratio:1;border-radius:0;z-index:2;
  background-repeat:no-repeat;background-position:center;background-size:contain;cursor:pointer}
.char.a .sdtok{right:-12%}
.char.b .sdtok{left:-12%}
.sdtok.empty{display:none}
.sdtok .ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:11px;color:var(--muted);line-height:1.3}
.sdtok .ph b{display:block;font-size:18px;color:var(--acc);font-family:var(--f-display)}
.sheet.capturing .sdtok.empty{display:none}
.rel{text-align:center;padding:4px 10px}
.rel .relv{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.25;margin-top:3px;word-break:keep-all}
.arrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px}
.who{width:30px;height:30px;border-radius:50%;background-size:cover;background-position:center top;border:2px solid;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:13px;color:#fff}
.line{position:relative;height:2px}
.line::after{content:"";position:absolute;right:-1px;top:-4px;border-style:solid;border-width:5px 0 5px 8px;border-color:transparent;border-left-color:inherit}
.line.ab{background:var(--ca);border-left-color:var(--ca)}
.line.ba{background:var(--cb);border-left-color:var(--cb)}
.say{grid-column:1/-1;font-size:13px;text-align:center;font-weight:600;line-height:1.4}
.lineup{position:relative;height:330px;margin:16px 0 0 28px;border-bottom:2px solid var(--ink)}
.tick{position:absolute;left:0;right:0;border-top:1px dotted var(--line)}
.tick span{position:absolute;left:-30px;top:-7px;width:26px;text-align:right;font-family:var(--f-mono);font-size:9.5px;color:var(--muted)}
.mark{position:absolute;left:0;right:0;border-top:1.5px dashed}
.figs{position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-end;gap:6px}
.fig{position:relative;flex:none;background-repeat:no-repeat;background-size:100% 100%;background-position:center bottom}
.hero.scaled{background-size:auto var(--sz);background-position:center bottom}
.hline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--acc);pointer-events:none}
.hline span{position:absolute;right:8px;top:-20px;font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--acc);background:var(--paper);padding:0 5px;border-radius:3px}
.char.b .hline span{right:auto;left:8px}
.chk{display:flex;align-items:flex-start;gap:8px;font-size:13px;font-weight:600;margin:4px 0 10px;cursor:pointer}
.chk input{margin-top:3px;width:16px;height:16px;flex:none}
.chk small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.fig .hv{position:absolute;left:0;right:0;top:-17px;text-align:center;font-family:var(--f-mono);font-size:11px;font-weight:500}
.lineup-cap{display:flex;justify-content:space-between;margin:5px 0 0 28px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.lineup-cap b{color:var(--ink);font-weight:500}
.pairpal{display:flex;height:16px;border-radius:8px;overflow:hidden}
.pairpal span{flex:1}
.pairtags{font-size:13px;font-weight:600;text-align:center;color:var(--muted)}
.foot{display:flex;justify-content:space-between;gap:12px;margin-top:22px;padding-top:10px;border-top:1px solid var(--line);font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--faint)}

.sheet.capturing [data-v]:empty::before{content:""}
.sheet.capturing [data-v]{background:transparent!important}
.sheet.capturing .ph{display:none}

/* sheet reflow */
@media (max-width:1180px){
  .body{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .center{grid-column:1/-1;order:3;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 24px;align-items:start}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  body{padding-bottom:96px}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:45;max-height:72vh;border-radius:16px 16px 0 0;border-bottom:0;
    transform:translateY(105%);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -8px 30px rgba(0,0,0,.25)}
  .side.open{transform:none}
  .side-close{display:inline-flex}
  .fab{display:inline-flex;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;align-items:center;gap:6px;
    background:var(--btn);color:var(--btn-fg);border:0;border-radius:24px;padding:12px 18px;font-weight:600;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
  .scrim{position:fixed;inset:0;z-index:44;background:rgba(0,0,0,.3)}
}
@media (max-width:700px){
  .char.a .sdtok{right:-8px} .char.b .sdtok{left:-8px}
  .body{grid-template-columns:minmax(0,1fr)}
  .center{display:flex}
  .char.b .cn{flex-direction:row;text-align:left}
  .char.b .tags,.char.b .quote{text-align:left}
  .char.b .quote{border-right:0;border-left:3px solid var(--acc)}
  .char.b .facts{justify-content:flex-start}
}
@media (max-width:520px){
  .sheet{padding:18px 14px}
  .pairname{font-size:30px}
  .sw{width:36px;height:36px}
  .char.a .sdtok{right:-4px} .char.b .sdtok{left:-4px}
}
@media (prefers-reduced-motion:no-preference){.side{transition:transform .25s ease}}

.modal{position:fixed;inset:0;z-index:60;background:rgba(10,12,16,.6);display:grid;place-items:center;padding:16px}
.dlg{background:var(--chrome);border-radius:12px;width:min(760px,100%);max-height:92vh;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--chrome-line)}
.dlg header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--chrome-line);font-weight:600}
.dlg .pv{overflow:auto;padding:16px;background:var(--bg);min-height:0}
.dlg .pv img{display:block;width:100%;height:auto;border-radius:4px}
.dlg footer{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 16px;border-top:1px solid var(--chrome-line)}
.dlg .hint2{color:var(--muted);font-size:12.5px;flex:1 1 220px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--btn);color:var(--btn-fg);padding:9px 16px;border-radius:8px;font-size:13px;max-width:calc(100% - 32px)}
</style>

<div class="bar">
  <span class="brand">페어틀</span>
  <div class="actions">
    <button class="btn" id="paperBtn" type="button">용지: 밝게</button>
    <button class="btn" id="clearBtn" type="button">모두 지우기</button>
    <button class="btn primary" id="exportBtn" type="button">이미지로 저장</button>
  </div>
</div>

<div class="app">
  <aside class="side" id="side" aria-label="내용 입력">
    <div class="side-h">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="pair" aria-selected="true"><span class="t">페어</span></button>
        <button type="button" role="tab" data-tab="a" aria-selected="false"><i class="d" data-dot="a"></i><span class="t" data-tabname="a">A</span></button>
        <button type="button" role="tab" data-tab="b" aria-selected="false"><i class="d" data-dot="b"></i><span class="t" data-tabname="b">B</span></button>
      </div>
      <button class="btn sm side-close" id="sideClose" type="button">닫기</button>
    </div>
    <div class="side-b" id="form"></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="stage">
  <article class="sheet" id="sheet">
    <i class="reg tl"></i><i class="reg tr"></i><i class="reg bl"></i><i class="reg br"></i>
    <header class="head">
      <div>
        <div class="eyebrow">Pair Profile Sheet<span data-v="pair.world" data-pre=" · "></span></div>
        <h1 class="pairname" data-v="pair.name" data-ph="페어명"></h1>
        <div class="pairsub" data-v="pair.sub" data-ph="한 줄 소개"></div>
      </div>
      <div class="duo"><span><i class="dot" style="background:var(--ca)"></i><span data-name="a"></span></span><span class="x2">×</span><span><i class="dot" style="background:var(--cb)"></i><span data-name="b"></span></span></div>
    </header>

    <div class="body">
      <section class="char a"></section>

      <aside class="center">
        <div class="rel">
          <div class="eyebrow">Relation</div>
          <div class="relv" data-v="pair.rel" data-ph="관계"></div>
        </div>
        <div class="arrow">
          <span class="who" data-who="a"></span><span class="line ab"></span><span class="who" data-who="b"></span>
          <div class="say" data-v="pair.ab" data-ph="A → B 한마디"></div>
        </div>
        <div class="arrow">
          <span class="who" data-who="b"></span><span class="line ba"></span><span class="who" data-who="a"></span>
          <div class="say" data-v="pair.ba" data-ph="B → A 한마디"></div>
        </div>
        <div>
          <div class="sec-t">Height</div>
          <div class="lineup" id="lineup" title="키 비교용 전신 이미지는 사이드바 A·B 탭에서 올려요"></div>
          <div class="lineup-cap"><span>cm</span><span id="hdiff"></span></div>
        </div>
        <div>
          <div class="sec-t">Pair color</div>
          <div class="pairpal" id="pairpal"></div>
        </div>
        <div class="pairtags" data-v="pair.tags" data-ph="#페어 태그"></div>
      </aside>

      <section class="char b"></section>
    </div>
    <footer class="foot"><span>PAIR PROFILE · MODEL SHEET</span><span id="footnames"></span></footer>
  </article>
  </main>
</div>

<button class="fab" id="fab" type="button">✎ 내용 입력</button>
<input type="file" id="file" accept="image/*" hidden>

<div class="modal" id="modal" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT">
    <header><span id="dlgT">이미지 미리보기</span><button class="btn" id="closeBtn" type="button">닫기</button></header>
    <div class="pv"><img id="pvImg" alt="페어틀 이미지 미리보기"></div>
    <footer>
      <p class="hint2" id="hint">이미지를 길게 누르거나 우클릭해서 저장할 수도 있어요.</p>
      <button class="btn primary" id="saveBtn" type="button">PNG 파일 저장</button>
    </footer>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<template id="charTpl">
  <div class="cn">
    <div>
      <div class="tag">CHARACTER %</div>
      <h2 class="cname" data-v="$.name" data-ph="이름"></h2>
      <div class="cen" data-v="$.en" data-ph="Name"></div>
    </div>
    <div class="letter">%</div>
  </div>
  <div class="herowrap">
  <div class="slot hero" data-slot="$.img" tabindex="0" role="button" aria-label="프로필 이미지 올리기">
    <div class="ph"><div><b>+</b>프로필 이미지</div></div>
    <div class="facts">
      <span class="fact" data-fact="$.age"><small>AGE</small><span data-v="$.age"></span></span>
      <span class="fact" data-fact="$.height"><small>HT</small><span data-v="$.height"></span></span>
      <span class="fact" data-fact="$.gender"><small>SEX</small><span data-v="$.gender"></span></span>
      <span class="fact" data-fact="$.job"><small>JOB</small><span data-v="$.job"></span></span>
    </div>
  </div>
    <div class="sdtok" data-slot="$.sd" tabindex="0" role="button" aria-label="SD 토큰 올리기"><div class="ph"><div><b>+</b>SD 토큰</div></div></div>
  </div>
  <div class="details">
    <figure><div class="slot" data-slot="$.face" tabindex="0" role="button" aria-label="얼굴 이미지 올리기"><div class="ph"><div><b>+</b>얼굴</div></div></div>
      <figcaption><small>FACE</small><span data-v="$.faceD" data-ph="눈매·인상"></span></figcaption></figure>
    <figure><div class="slot" data-slot="$.fit" tabindex="0" role="button" aria-label="의상 이미지 올리기"><div class="ph"><div><b>+</b>의상</div></div></div>
      <figcaption><small>OUTFIT</small><span data-v="$.fitD" data-ph="옷차림"></span></figcaption></figure>
    <figure><div class="slot" data-slot="$.item" tabindex="0" role="button" aria-label="소품·특징 이미지 올리기"><div class="ph"><div><b>+</b>소품·특징</div></div></div>
      <figcaption><small>POINT</small><span data-v="$.itemD" data-ph="점·흉터·소지품"></span></figcaption></figure>
  </div>
  <div>
    <div class="sec-t">Colors</div>
    <div class="colors">
      <div class="col"><span class="sw" data-c="$.hair"></span><span class="lb">HAIR</span><span class="d" data-v="$.hairD" data-ph="머리"></span></div>
      <div class="col"><span class="sw" data-c="$.eye"></span><span class="lb">EYE</span><span class="d" data-v="$.eyeD" data-ph="눈"></span></div>
      <div class="col"><span class="sw" data-c="$.skin"></span><span class="lb">SKIN</span><span class="d" data-v="$.skinD" data-ph="피부"></span></div>
      <div class="col"><span class="sw" data-c="$.top"></span><span class="lb">TOP</span><span class="d" data-v="$.topD" data-ph="상의"></span></div>
      <div class="col"><span class="sw" data-c="$.bottom"></span><span class="lb">BOTTOM</span><span class="d" data-v="$.bottomD" data-ph="하의"></span></div>
    </div>
  </div>
  <div>
    <div class="sec-t">Palette</div>
    <div class="stripe" data-goto="$.p1"><span data-c="$.p1"></span><span data-c="$.p2"></span><span data-c="$.p3"></span><span data-c="$.p4"></span><span data-c="$.p5"></span></div>
    <div class="hexes"><span data-hex="$.p1"></span><span data-hex="$.p2"></span><span data-hex="$.p3"></span><span data-hex="$.p4"></span><span data-hex="$.p5"></span></div>
  </div>
  <div class="tags" data-v="$.tags" data-ph="#키워드 #태그"></div>
  <blockquote class="quote" data-v="$.quote" data-ph="대표 대사"></blockquote>
</template>

<script>
const STORE = "pairsheet-v3";
const ACC = { a:"#2F5D6E", b:"#C2456A" };
const blank = () => ({ paper:"light", "a.acc":ACC.a, "b.acc":ACC.b, "a.hmode":"auto", "b.hmode":"auto" });
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const sheet = $("#sheet"), form = $("#form");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let state = (()=>{ try{ const s = localStorage.getItem(STORE); return s ? {...blank(), ...JSON.parse(s)} : blank(); }catch(e){ return blank(); } })();
let saveT;
function persist(){ clearTimeout(saveT); saveT = setTimeout(()=>{ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){ toast("브라우저 저장 공간이 모자라 임시 저장을 못 했어요. 이미지 저장은 그대로 돼요."); } }, 300); }

const tpl = $("#charTpl").innerHTML;
["a","b"].forEach(s => { document.querySelector(`.char.${s}`).innerHTML = tpl.replaceAll("$", s).replaceAll("%", s.toUpperCase()); });

/* ───── sidebar form ───── */
const T = (k, l, ph="") => ({t:"text", k, l, ph});
const SCHEMA = {
  pair: [
    {t:"grp", l:"페어"}, T("pair.name","페어명","예: VINCERE"), T("pair.sub","한 줄 소개"), T("pair.world","세계관","예: 센티넬 가이드 버스"),
    {t:"grp", l:"관계"}, T("pair.rel","관계","예: 소꿉친구 → 동거인"), T("pair.ab","A → B 한마디"), T("pair.ba","B → A 한마디"),
    T("pair.tags","페어 태그","예: #파멸 #구원"),
  ],
  char: s => [
    {t:"grp", l:"기본"}, T(`${s}.name`,"이름"), T(`${s}.en`,"영문·이명"),
    {t:"pair", items:[T(`${s}.age`,"나이","예: 27"), T(`${s}.height`,"키","예: 178cm")]},
    {t:"pair", items:[T(`${s}.gender`,"성별","예: 남 / 여"), T(`${s}.job`,"직업")]},
    {t:"acc", k:`${s}.acc`, l:"대표색"},
    {t:"grp", l:"이미지"},
    {t:"img", k:`${s}.img`, l:"프로필"},
    {t:"img", k:`${s}.face`, l:"얼굴", cap:`${s}.faceD`, ph:"눈매·인상"},
    {t:"img", k:`${s}.fit`, l:"의상", cap:`${s}.fitD`, ph:"옷차림"},
    {t:"img", k:`${s}.item`, l:"소품·특징", cap:`${s}.itemD`, ph:"점·흉터·소지품"},
    {t:"img", k:`${s}.sd`, l:"SD 토큰"},
    {t:"grp", l:"키 비교"},
    {t:"img", k:`${s}.body`, l:"전신 (키 비교용)"},
    {t:"hmode", k:`${s}.hmode`},
    {t:"grp", l:"색"},
    {t:"color", k:`${s}.hair`, l:"머리", cap:`${s}.hairD`, ph:"예: 흑발 울프컷"},
    {t:"color", k:`${s}.eye`, l:"눈", cap:`${s}.eyeD`, ph:"예: 회청색"},
    {t:"color", k:`${s}.skin`, l:"피부", cap:`${s}.skinD`, ph:"예: 창백"},
    {t:"color", k:`${s}.top`, l:"상의", cap:`${s}.topD`, ph:"예: 차콜 코트"},
    {t:"color", k:`${s}.bottom`, l:"하의", cap:`${s}.bottomD`, ph:"예: 검정 슬랙스"},
    {t:"grp", l:"팔레트"}, {t:"pal", s},
    {t:"grp", l:"기타"}, T(`${s}.tags`,"태그","#흑발 #장신"), T(`${s}.quote`,"대표 대사"),
  ]
};
const fid = k => "f-" + k.replace(/\./g,"-");
function textField(f){ return `<div class="fld"><label for="${fid(f.k)}">${f.l}</label><input class="inp" id="${fid(f.k)}" data-f="${f.k}" placeholder="${esc(f.ph)}" autocomplete="off"></div>`; }
function buildForm(tab){
  const list = tab === "pair" ? SCHEMA.pair : SCHEMA.char(tab);
  form.innerHTML = list.map(f => {
    if (f.t === "grp") return `<div class="grp">${f.l}</div>`;
    if (f.t === "text") return textField(f);
    if (f.t === "pair") return `<div class="row2">${f.items.map(textField).join("")}</div>`;
    if (f.t === "acc") return `<div class="crow"><span class="lbl">${f.l}</span><input type="color" id="${fid(f.k)}" data-col="${f.k}" aria-label="${f.l}"><span class="lbl" style="width:auto;font-weight:400">이름·선·키 실루엣에 쓰여요</span><span></span></div>`;
    if (f.t === "color") return `<div class="crow"><span class="lbl">${f.l}</span><input type="color" id="${fid(f.k)}" data-col="${f.k}" aria-label="${f.l} 색"><input class="inp" id="${fid(f.cap)}" data-f="${f.cap}" placeholder="${esc(f.ph)}" aria-label="${f.l} 설명" autocomplete="off"><button class="x" type="button" data-xcol="${f.k}" aria-label="${f.l} 색 지우기">×</button></div>`;
    if (f.t === "pal") return `<div class="prow">${[1,2,3,4,5].map(i => `<input type="color" id="${fid(`${f.s}.p${i}`)}" data-col="${f.s}.p${i}" aria-label="팔레트 ${i}">`).join("")}</div><div style="display:flex;justify-content:flex-end;margin-top:6px"><button class="btn sm" type="button" data-xpal="${f.s}">팔레트 비우기</button></div>`;
    if (f.t === "scale") return `<label class="chk"><input type="checkbox" id="f-pair-scale" data-chk="pair.scale"><span>전신 이미지를 키 비율로 맞추기<small>두 캐릭터의 키를 적으면 작은 쪽 전신 이미지가 그만큼 작아져요. 이미지 위아래 빈 여백은 자동으로 잘라요.</small></span></label>`;
    if (f.t === "hmode") return `<div class="fld"><span class="lbl">키 그래프 표시</span><div class="seg" role="radiogroup">${[["auto","자동"],["m","남성"],["f","여성"],["img","이미지"]].map(([v,l]) => `<label><input type="radio" name="${fid(f.k)}" value="${v}" data-hm="${f.k}">${l}</label>`).join("")}</div><small class="lbl" style="font-weight:400">자동: 키 비교용 전신 이미지가 있으면 그 이미지를 키에 맞춰 세우고, 없으면 성별에 맞는 실루엣을 써요. 이미지 위아래 빈 여백은 자동으로 잘라요.</small></div>`;
    if (f.t === "img") return `<div class="imgf"><button class="thumb" type="button" data-up="${f.k}" aria-label="${f.l} 이미지 올리기">+</button><div class="r"><div class="top"><span class="lbl">${f.l}</span><button class="btn sm" type="button" data-up="${f.k}">올리기</button><button class="btn sm" type="button" data-xi="${f.k}">지우기</button></div>${f.cap ? `<input class="inp" id="${fid(f.cap)}" data-f="${f.cap}" placeholder="${esc(f.ph)}" aria-label="${f.l} 설명" autocomplete="off">` : ""}</div></div>`;
    return "";
  }).join("") + (tab === "pair" ? `<p class="help">미리보기의 글자나 사진 칸을 눌러도 해당 입력칸으로 이동해요.</p>` : "");
  syncForm();
}
function syncForm(){
  form.querySelectorAll("[data-f]").forEach(i => { if (document.activeElement !== i) i.value = state[i.dataset.f] || ""; });
  form.querySelectorAll("[data-col]").forEach(i => { i.value = state[i.dataset.col] || "#c4c8ce"; });
  form.querySelectorAll("[data-hm]").forEach(i => { i.checked = (state[i.dataset.hm] || "auto") === i.value; });
  form.querySelectorAll("button.thumb[data-up]").forEach(b => { const v = state[b.dataset.up]; b.style.backgroundImage = v ? `url("${v}")` : "none"; b.textContent = v ? "" : "+"; b.classList.toggle("has", !!v); });
  form.querySelectorAll("[data-xi]").forEach(b => b.hidden = !state[b.dataset.xi]);
  form.querySelectorAll("[data-chk]").forEach(i => i.checked = state[i.dataset.chk] !== false);
}
form.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.f) { state[t.dataset.f] = t.value; }
  else if (t.dataset.col) { state[t.dataset.col] = t.value; }
  else if (t.dataset.hm) { state[t.dataset.hm] = t.value; }
  else return;
  persist(); render();
});
form.addEventListener("change", e => { if (e.target.dataset.chk) { state[e.target.dataset.chk] = e.target.checked; persist(); render(); return; } if (e.target.dataset.hm) { state[e.target.dataset.hm] = e.target.value; persist(); render(); } });
form.addEventListener("click", e => {
  const up = e.target.closest("[data-up]"); if (up) { pickImage(up.dataset.up); return; }
  const xi = e.target.closest("[data-xi]"); if (xi) { state[xi.dataset.xi] = null; if (/\.body$/.test(xi.dataset.xi)) { state[xi.dataset.xi+"T"] = null; state[xi.dataset.xi+"A"] = null; } persist(); render(); syncForm(); return; }
  const xc = e.target.closest("[data-xcol]"); if (xc) { state[xc.dataset.xcol] = null; persist(); render(); syncForm(); return; }
  const xp = e.target.closest("[data-xpal]"); if (xp) { [1,2,3,4,5].forEach(i => state[`${xp.dataset.xpal}.p${i}`] = null); persist(); render(); syncForm(); }
});

let tab = "pair";
function setTab(t){ tab = t; $$("[data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t)); buildForm(t); form.scrollTop = 0; }
$$("[data-tab]").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));

/* drawer (phone) */
const mq = matchMedia("(max-width:900px)");
function openSide(){ if (mq.matches) { $("#side").classList.add("open"); $("#scrim").hidden = false; } }
function closeSide(){ $("#side").classList.remove("open"); $("#scrim").hidden = true; }
$("#fab").addEventListener("click", openSide);
$("#sideClose").addEventListener("click", closeSide);
$("#scrim").addEventListener("click", closeSide);

/* clicking the preview jumps to the matching input */
function goto(key){
  const t = key.split(".")[0];
  if (tab !== t) setTab(t);
  openSide();
  requestAnimationFrame(() => {
    const el = document.getElementById(fid(key)) || form.querySelector(`[data-up="${key}"]`);
    if (!el) return;
    el.scrollIntoView({block:"center", behavior:"smooth"});
    el.focus({preventScroll:true});
    if (el.classList.contains("inp")) { el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
  });
}
sheet.addEventListener("click", e => {
  const v = e.target.closest("[data-v],[data-c],[data-goto]");
  if (v) { e.stopPropagation(); goto(v.dataset.goto || v.dataset.v || v.dataset.c); return; }
  const s = e.target.closest("[data-slot]");
  if (s) pickImage(s.dataset.slot);
});
sheet.addEventListener("keydown", e => { const s = e.target.closest("[data-slot]"); if (s && e.target === s && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); pickImage(s.dataset.slot); } });
$$("[data-slot]").forEach(p => {
  p.addEventListener("dragover", e => e.preventDefault());
  p.addEventListener("drop", e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) loadImg(p.dataset.slot, f); });
});

/* images */
const fileIn = $("#file"); let slotKey = null;
function pickImage(key){ slotKey = key; fileIn.value = ""; fileIn.click(); }
fileIn.addEventListener("change", () => { const f = fileIn.files[0]; if (f && slotKey) loadImg(slotKey, f); });
function loadImg(key, file){
  if (!file.type.startsWith("image/")) { toast("이미지 파일만 올릴 수 있어요."); return; }
  const url = URL.createObjectURL(file), im = new Image();
  im.onload = () => {
    const max = /\.(img|body)$/.test(key) ? 1200 : 700, k = Math.min(1, max / Math.max(im.width, im.height));
    const c = document.createElement("canvas"); c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
    state[key] = c.toDataURL(file.type === "image/png" ? "image/png" : "image/jpeg", .9);
    URL.revokeObjectURL(url);
    if (/^[ab]\.body$/.test(key)) { state[key+"T"] = null; trimFor(key); }
    persist(); render(); syncForm();
  };
  im.onerror = () => toast("이미지를 읽지 못했어요. 다른 파일로 해 보세요.");
  im.src = url;
}

/* male / female height silhouettes, drawn at 200×600 so the figure's height = full canvas */
const silCache = {};
function silhouette(kind, color){
  const sig = kind + color; if (silCache[sig]) return silCache[sig];
  const cv = document.createElement("canvas"); cv.width = 200; cv.height = 600;
  const g = cv.getContext("2d"); g.fillStyle = color; g.strokeStyle = color; g.lineJoin = "round"; g.lineWidth = 10;
  const poly = pts => { g.beginPath(); pts.forEach(([x,y],i) => i ? g.lineTo(x,y) : g.moveTo(x,y)); g.closePath(); g.fill(); g.stroke(); };
  const rr = (x,y,w,h,r) => { g.beginPath(); g.roundRect(x,y,w,h,r); g.fill(); };
  const ell = (x,y,rx,ry) => { g.beginPath(); g.ellipse(x,y,rx,ry,0,0,Math.PI*2); g.fill(); };
  if (kind === "m") {
    ell(100,42,27,34); rr(89,70,22,30,6);
    poly([[50,104],[150,104],[138,300],[62,300]]);
    g.save(); g.translate(42,108); g.rotate(.05); rr(-10,0,22,190,11); g.restore();
    g.save(); g.translate(158,108); g.rotate(-.05); rr(-12,0,22,190,11); g.restore();
    ell(35,302,11,13); ell(165,302,11,13);
    rr(64,290,36,292,12); rr(100,290,36,292,12);
    rr(58,578,42,18,9); rr(100,578,42,18,9);
  } else {
    g.beginPath(); g.ellipse(100,48,34,42,0,0,Math.PI*2); g.fill(); rr(66,48,68,78,22);
    ell(100,46,25,32); rr(91,72,18,30,6);
    poly([[66,106],[134,106],[122,222],[78,222]]);
    g.save(); g.translate(58,110); g.rotate(.09); rr(-9,0,17,176,9); g.restore();
    g.save(); g.translate(142,110); g.rotate(-.09); rr(-8,0,17,176,9); g.restore();
    ell(45,288,9,11); ell(155,288,9,11);
    poly([[78,216],[122,216],[146,372],[54,372]]);
    rr(78,360,20,222,9); rr(102,360,20,222,9);
    rr(72,580,28,15,7); rr(100,580,28,15,7);
  }
  return silCache[sig] = cv.toDataURL("image/png");
}

/* render sheet */
const nm = s => state[s+".name"] || s.toUpperCase();
const num = v => { const m = String(v||"").match(/\d+(\.\d+)?/); return m ? parseFloat(m[0]) : null; };
const okH = v => v && v > 20 && v < 400;
function sexOf(s){ const m = state[s+".hmode"] || "auto"; if (m === "m" || m === "f") return m; return /여|女|f(emale)?\b|woman|girl/i.test(state[s+".gender"]||"") ? "f" : "m"; }
function figInfo(s){
  const m = state[s+".hmode"] || "auto", img = state[s+".bodyT"] || state[s+".body"];
  if ((m === "auto" || m === "img") && img) return { src: img, a: state[s+".bodyA"] || .42 };
  return { src: silhouette(sexOf(s), state[s+".acc"]), a: 1/3 };
}
/* cut empty margin around a full-body picture so the head touches the height line */
function trimFor(key){
  const src = state[key]; if (!src) return;
  const im = new Image();
  im.onload = () => {
    const w = im.width, h = im.height, c = document.createElement("canvas"); c.width = w; c.height = h;
    const g = c.getContext("2d"); g.drawImage(im, 0, 0);
    let d; try { d = g.getImageData(0, 0, w, h).data; } catch(e) { return; }
    let alpha = false; for (let i = 3; i < d.length; i += 4*61) if (d[i] < 245) { alpha = true; break; }
    const bg = [d[0], d[1], d[2]];
    const isBg = i => alpha ? d[i+3] < 20 : Math.abs(d[i]-bg[0]) + Math.abs(d[i+1]-bg[1]) + Math.abs(d[i+2]-bg[2]) < 42;
    let x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) { if (!isBg((y*w+x)*4)) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; } }
    if (state[key] !== src) return;
    if (x1 < 0) { state[key+"T"] = src; state[key+"A"] = w/h; }
    else {
      x1 = Math.min(w-1, x1+2); y1 = Math.min(h-1, y1+2);
      const cw = x1-x0+1, ch = y1-y0+1, o = document.createElement("canvas"); o.width = cw; o.height = ch;
      o.getContext("2d").drawImage(c, x0, y0, cw, ch, 0, 0, cw, ch);
      state[key+"T"] = o.toDataURL(alpha ? "image/png" : "image/jpeg", .9); state[key+"A"] = cw/ch;
    }
    persist(); render();
  };
  im.src = src;
}

function render(){
  sheet.classList.toggle("dark", state.paper === "dark");
  $("#paperBtn").textContent = state.paper === "dark" ? "용지: 어둡게" : "용지: 밝게";
  sheet.style.setProperty("--ca", state["a.acc"]); sheet.style.setProperty("--cb", state["b.acc"]);
  ["a","b"].forEach(s => {
    document.querySelector(`.char.${s}`).style.setProperty("--acc", state[s+".acc"]);
    $(`[data-dot="${s}"]`).style.background = state[s+".acc"];
    $(`[data-tabname="${s}"]`).textContent = state[s+".name"] || s.toUpperCase();
  });
  $$("[data-v]").forEach(el => { const v = state[el.dataset.v] || ""; el.textContent = v && el.dataset.pre ? el.dataset.pre + v : v; });
  $$("[data-fact]").forEach(f => f.classList.toggle("empty", !state[f.dataset.fact]));
  $$("[data-slot]").forEach(p => { const img = state[p.dataset.slot]; p.style.backgroundImage = img ? `url("${img}")` : "none"; p.querySelector(".ph").hidden = !!img; p.classList.toggle("empty", !img); });
  $$("[data-who]").forEach(w => {
    const s = w.dataset.who, face = state[s+".sd"] || state[s+".face"];
    w.style.borderColor = state[s+".acc"]; w.style.backgroundColor = state[s+".acc"];
    w.style.backgroundImage = face ? `url("${face}")` : "none"; w.textContent = face ? "" : s.toUpperCase();
  });
  $$("[data-c]").forEach(b => { const v = state[b.dataset.c]; b.style.backgroundColor = v || "transparent"; b.classList.toggle("unset", !v); });
  $$("[data-hex]").forEach(h => h.textContent = (state[h.dataset.hex] || "").replace("#","").toUpperCase());
  $$("[data-name]").forEach(n => n.textContent = nm(n.dataset.name));
  $("#footnames").textContent = `${nm("a")} × ${nm("b")}`;
  $("#pairpal").innerHTML = ["a.acc","a.hair","a.eye","b.eye","b.hair","b.acc"].map(k => state[k]).filter(Boolean).map(c => `<span style="background:${c}"></span>`).join("");
  renderLineup();
}
function renderLineup(){
  const ha = num(state["a.height"]), hb = num(state["b.height"]);
  const valid = [ha, hb].filter(okH);
  const top = valid.length ? Math.ceil((Math.max(...valid) + 12) / 20) * 20 : 200;
  const step = top > 240 ? 50 : 20;
  let h = "";
  for (let v = step; v <= top; v += step) h += `<div class="tick" style="bottom:${v/top*100}%"><span>${v}</span></div>`;
  [["a",ha],["b",hb]].forEach(([s,v]) => { if (okH(v)) h += `<div class="mark" style="bottom:${v/top*100}%;border-color:${state[s+".acc"]}"></div>`; });
  const LH = $("#lineup").clientHeight || 330, LW = Math.max(120, $("#lineup").clientWidth || 230);
  const infos = { a: figInfo("a"), b: figInfo("b") };
  const hp = (s, v) => (okH(v) ? v/top : .82) * LH;
  let wa = hp("a",ha)*infos.a.a, wb = hp("b",hb)*infos.b.a;
  const squeeze = Math.min(1, (LW*1.15) / (wa + wb));   // wide pictures may overlap a little, never spill far
  const fig = (s, v) => { const ok = okH(v), i = infos[s], ph = hp(s, v); const fw = ph * i.a * squeeze;
    return `<div class="fig" data-goto="${s}.body" style="cursor:pointer;height:${ph}px;width:${fw}px;margin:0 ${squeeze < 1 ? -4 : 0}px;background-image:url('${i.src}');background-size:100% 100%;${ok ? "" : "opacity:.22"}"><span class="hv" style="color:${state[s+".acc"]}">${ok ? v : "?"}</span></div>`; };
  h += `<div class="figs">${fig("a",ha)}${fig("b",hb)}</div>`;
  $("#lineup").innerHTML = h;
  $("#hdiff").innerHTML = valid.length === 2 ? `차이 <b>${Math.round(Math.abs(ha-hb)*10)/10}</b>` : "";
}

/* toolbar */
$("#paperBtn").addEventListener("click", () => { state.paper = state.paper === "dark" ? "light" : "dark"; persist(); render(); });
let clearArmed = null;
$("#clearBtn").addEventListener("click", () => {
  const b = $("#clearBtn");
  if (!clearArmed) { b.textContent = "한 번 더 누르면 지워져요"; b.classList.add("warn");
    clearArmed = setTimeout(() => { clearArmed = null; b.textContent = "모두 지우기"; b.classList.remove("warn"); }, 3500); return; }
  clearTimeout(clearArmed); clearArmed = null; b.textContent = "모두 지우기"; b.classList.remove("warn");
  const paper = state.paper; state = blank(); state.paper = paper;
  persist(); render(); buildForm(tab); toast("모두 지웠어요.");
});

/* export */
let downloads = null, lastBlob = null;
(async () => { try { downloads = window.claude?.use ? await window.claude.use("downloads") : null; } catch(e){ downloads = null; } })();
$("#exportBtn").addEventListener("click", async () => {
  const b = $("#exportBtn");
  if (typeof html2canvas !== "function") { toast("이미지 도구를 불러오지 못했어요. 새로고침 후 다시 해 보세요."); return; }
  b.disabled = true; b.textContent = "만드는 중…"; closeSide();
  try {
    if (document.fonts?.ready) await document.fonts.ready;
    const canvas = await html2canvas(sheet, { scale: 2, backgroundColor: null, logging: false, windowWidth: 1900,
      onclone: doc => { const s = doc.getElementById("sheet"); s.classList.add("capturing"); s.style.width = "1400px"; s.style.maxWidth = "none"; } });
    lastBlob = await new Promise(r => canvas.toBlob(r, "image/png"));
    $("#pvImg").src = canvas.toDataURL("image/png");
    $("#saveBtn").hidden = !downloads;
    $("#hint").textContent = downloads ? "이미지를 길게 누르거나 우클릭해서 저장할 수도 있어요." : "이미지를 길게 누르거나 우클릭한 뒤 ‘이미지 저장’을 고르세요.";
    $("#modal").hidden = false; $("#closeBtn").focus();
  } catch(e) { toast("이미지를 만들지 못했어요. 올린 사진을 바꾸거나 다시 시도해 보세요."); }
  finally { b.disabled = false; b.textContent = "이미지로 저장"; }
});
$("#saveBtn").addEventListener("click", async () => {
  if (!downloads || !lastBlob) return;
  const safe = s => s.replace(/[\\/:*?"<>|]/g, "").trim();
  try { await downloads.save({ filename: `${safe(nm("a"))}x${safe(nm("b"))}_페어틀.png`, data: lastBlob }); toast("저장했어요."); }
  catch(e) {
    const c = e && e.code; if (c === "declined") return;
    if (c === "rate_limited") { toast("저장 창이 이미 열려 있어요. 잠시 뒤 다시 눌러 주세요."); return; }
    $("#saveBtn").hidden = true; $("#hint").textContent = "여기서는 파일 저장이 막혀 있어요. 이미지를 길게 누르거나 우클릭해서 저장하세요.";
  }
});
const closeModal = () => { $("#modal").hidden = true; $("#exportBtn").focus(); };
$("#closeBtn").addEventListener("click", closeModal);
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
document.addEventListener("keydown", e => { if (e.key !== "Escape") return; if (!$("#modal").hidden) closeModal(); else closeSide(); });
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3000); }

buildForm("pair"); render();
["a.body","b.body"].forEach(k => { if (state[k] && !state[k+"T"]) trimFor(k); });
addEventListener("resize", () => { clearTimeout(window._rz); window._rz = setTimeout(renderLineup, 120); });
</script>

</body></html>
